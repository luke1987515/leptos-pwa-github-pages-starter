<script type="module">
import init, * as bindings from '/leptos-pwa-github-pages-starter/leptos-pwa-github-pages-starter-604a834a08ae6815.js';
const wasm = await init({ module_or_path: '/leptos-pwa-github-pages-starter/leptos-pwa-github-pages-starter-604a834a08ae6815_bg.wasm' });

</script>

<link rel="modulepreload" href="/leptos-pwa-github-pages-starter/leptos-pwa-github-pages-starter-604a834a08ae6815.js" crossorigin="anonymous" integrity="sha384-9TsbvPAk7kwsi9N/feziZ4UvjIRRGQPJqQPn5svjr4Ajlaz0WD2BvbxRs2JpIO8+"><link rel="preload" href="/leptos-pwa-github-pages-starter/leptos-pwa-github-pages-starter-604a834a08ae6815_bg.wasm" crossorigin="anonymous" integrity="sha384-xsZjwjboPKnOGKau8p1MGg3BMl7QHHscjbYYgkffTwXBcOxJi1Nn8Aktu70MF/4n" as="fetch" type="application/wasm"></head>
<body>
  <!-- App Mount Point -->
  <div id="app"></div>

  <!-- Service Worker Registration & Update Logic -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Use relative path for registration so it works seamlessly under subpaths (like GitHub Pages)
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);

            // Handle updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      console.log('New update available. Dispatching event...');
                      window.dispatchEvent(new CustomEvent('sw-update-available'));
                    }
                  }
                });
              }
            });
          })
          .catch(error => {
            console.error('Service Worker registration failed:', error);
          });
      });
      
      // Handle controller change (e.g. when skipWaiting completes and new SW activates)
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('Service Worker controller changed. Reloading page...');
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
